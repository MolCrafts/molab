name: lint

# Same jobs in every context (feature branch or dev/master, fork or
# upstream); see "CI and release" in docs/en/development/index.md.
'on':
  workflow_call:

permissions:
  contents: read

# One group per file, workflow, event and ref; only a feature ref cancels its
# superseded runs. The canonical block: actions/check-workflows.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

# molab is built against the commits pinned in .github/partners.env.
# scripts/partners.py bootstraps molcrafts_ci.partners at CI_REF and checks
# those commits out as siblings, the layout the [tool.uv.sources] path
# dependencies expect. The git hooks resolve them the same way
# (`partners.py run`), so a local gate and CI judge the same inputs.
env:
  # uv builds molrs through maturin's PEP 517 hook; this makes that cargo
  # build --locked as well.
  MATURIN_PEP517_ARGS: --locked

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    permissions:
      contents: read
    name: lint
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76

  python:
    name: lint / python
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      # molpy/rust-toolchain.toml pins the compiler that builds the molpy wheel.
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          toolchain-dir: ../molpy
          cache: molpy
          workspaces: ../molpy/molpy -> ../target
      - run: python3 scripts/partners.py check
      - run: uv sync --extra dev
      - run: uv run ruff format --check src/ tests/
      - run: uv run ruff check src/ tests/
      - run: uv run ty check src/

  web:
    name: lint / web
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # molvis and the molpy it builds molwasm from, at the commits
      # .github/partners.env pins. apps/web needs no other sibling: molplot and
      # the molcrafts-ui packages resolve from npm, ui-markdown and the file
      # tree from src/vendor/.
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      # setup-node hashes the lockfile with hashFiles, which cannot see a
      # sibling checkout. Node is installed here; npm install runs in the shell.
      - name: Set up Node
        uses: MolCrafts/molcrafts-ci/actions/setup-node@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          install: "false"
      # molvis/core depends on file:../../molpy/molwasm/pkg. Build it the way
      # molvis's own CI does at MOLVIS_REF (.github/actions/setup-source).
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          toolchain-dir: ../molpy
          cache: molwasm
          workspaces: ../molpy/molwasm -> ../target
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: wasm-pack@0.15.0
      - name: Install Binaryen
        run: |
          set -euo pipefail
          # The build-tool pin molvis's setup-source uses at MOLVIS_REF.
          binaryen_version=version_133
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/${binaryen_version}/binaryen-${binaryen_version}-x86_64-linux.tar.gz" \
            | sudo tar -xz -C /usr/local --strip-components=1
          wasm-opt --version
      - name: Build molwasm, then install molvis
        working-directory: ../molvis
        run: |
          npm run build:molwasm
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build the molvis stage the web typecheck imports
        working-directory: ../molvis
        run: npm run build:stage
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      - run: npm run lint
      - run: npm run typecheck

  workflows:
    name: lint / workflows
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/check-workflows@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
