name: lint

# Same jobs in every context (feature branch or dev/master, fork or
# upstream); see "CI and release" in docs/en/development/index.md.
'on':
  workflow_call:

permissions:
  contents: read

# One group per file, workflow, event and ref; only a feature ref cancels its
# superseded runs. The canonical block: actions/check-workflows.
concurrency:
  group: lint-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

# molab is built against the commits pinned in .github/partners.env.
# scripts/partners.py bootstraps molcrafts_ci.partners at CI_REF and checks
# those commits out as siblings, the layout the [tool.uv.sources] path
# dependencies expect. The git hooks resolve them the same way
# (`partners.py run`), so a local gate and CI judge the same inputs.
env:
  # uv builds molrs through maturin's PEP 517 hook; this makes that cargo
  # build --locked as well.
  MATURIN_PEP517_ARGS: --locked

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    permissions:
      contents: read
    name: lint
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@f5d3606fab87fc162271c94219dbdc5201dd1aab

  python:
    name: lint / python
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@f5d3606fab87fc162271c94219dbdc5201dd1aab
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@f5d3606fab87fc162271c94219dbdc5201dd1aab
      # molrs/rust-toolchain.toml pins the compiler that builds the molrs wheel.
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@f5d3606fab87fc162271c94219dbdc5201dd1aab
        with:
          toolchain-dir: ../molrs
          cache: molrs-python
          workspaces: ../molrs/molrs-python -> ../target
      - run: python3 scripts/partners.py check
      - run: uv sync --extra dev
      - run: uv run ruff format --check src/ tests/
      - run: uv run ruff check src/ tests/
      - run: uv run ty check src/

  web:
    name: lint / web
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out molvis
        uses: MolCrafts/molcrafts-ci/actions/setup-partners@f5d3606fab87fc162271c94219dbdc5201dd1aab
        with:
          repository: MolCrafts/molvis
          ref: dev
          path: ../molvis
      - name: Build the molvis stage the web typecheck imports
        uses: MolCrafts/molcrafts-ci/actions/setup-node@f5d3606fab87fc162271c94219dbdc5201dd1aab
        with:
          working-directory: ../molvis
      - working-directory: ../molvis
        run: npm run build:stage
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@f5d3606fab87fc162271c94219dbdc5201dd1aab
      - run: npm run lint
      - run: npm run typecheck

  workflows:
    name: lint / workflows
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/check-workflows@f5d3606fab87fc162271c94219dbdc5201dd1aab
