name: release

# A `v*` tag on MolCrafts builds the sdist and the wheel with the web UI
# bundled (src/molexp/dist) and publishes them to PyPI (trusted publishing,
# release.yml and the `pypi` environment). workflow_dispatch is a dry run
# anywhere: the same build, kept as a workflow artifact, and no environment.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One group per file, workflow, event and ref. Under workflow_call (release.yml
# running lint/test) github.workflow and github.event_name are the caller's, so
# a called run never shares, and so never cancels, a direct run's group.
concurrency:
  group: release-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: release / build
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@master
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@master
      - run: npm run build:web
      - run: test -s src/molexp/dist/index.html
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: release / pypi
    needs: build
    if: github.event_name == 'push' && github.repository_owner == 'MolCrafts'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'pypi' || '' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
