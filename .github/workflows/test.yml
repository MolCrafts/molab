name: test

# Two tiers (`test / context` decides; see "CI and release" in
# docs/en/development/index.md):
#
#   fast  a feature-branch push to MolCrafts: the unit suite on Linux, the
#         web tests.
#   full  every push to a fork (proven before its pull request), dev and
#         master on MolCrafts, pull requests, tags and dispatches:
#         + pytest on macOS.
#
# Windows is not a target (termios, process groups).
'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - dev
    - master
    - main
  workflow_dispatch: null

permissions:
  contents: read

# One group per file, workflow, event and ref; only a feature ref cancels its
# superseded runs. The canonical block: actions/check-workflows.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

# molab is built against its partners (.github/partners.env) at the commits
# scripts/partners.py resolves, as in lint.yml.
env:
  # uv builds molrs through maturin's PEP 517 hook; this makes that cargo
  # build --locked as well.
  MATURIN_PEP517_ARGS: --locked

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    permissions:
      contents: read
    name: test
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76

  python:
    name: test / python (${{ matrix.os }})
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      # molpy/rust-toolchain.toml pins the compiler that builds the molpy wheel.
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
        with:
          toolchain-dir: ../molpy
          cache: molpy
          workspaces: ../molpy/molpy -> ../target
      # Editable molq looks for src/molq/_bin/molq. uv's editable install does
      # not run setup.py's go build, and macOS then reports the binary missing.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
      - name: Build the molq serve binary
        working-directory: ../molq
        run: |
          mkdir -p src/molq/_bin
          CGO_ENABLED=0 go build -o src/molq/_bin/molq ./cmd/molq
      - run: uv run --extra dev pytest tests/ -q
      - name: Verify sharing with two real Linux UIDs
        if: runner.os == 'Linux'
        # Ubuntu homes are 0750: a probe that has dropped to a disposable UID
        # must still traverse $HOME to import molab from the checkout.
        run: |
          chmod o+x "$HOME"
          sudo -E "$PWD/.venv/bin/python" -m pytest tests/test_server/test_sharing_linux.py -q

  web:
    name: test / web
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@3cc26f4ff1b8b6d09365d677c4a05cc8cbb70a76
      - run: npm run test:web

  docs:
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    uses: ./.github/workflows/docs.yml
    secrets: inherit

  lint:
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  result:
    name: test / result
    needs: [context, python, web, docs, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")'
