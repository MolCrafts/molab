name: test

# Two tiers (`test / context` decides; see "CI and release" in
# docs/en/development/index.md):
#
#   fast  a feature-branch push to MolCrafts: the unit suite on Linux, the
#         web tests.
#   full  every push to a fork (proven before its pull request), dev and
#         master on MolCrafts, pull requests, tags and dispatches:
#         + pytest on macOS.
#
# Windows is not a target (termios, process groups).
'on':
  push:
    branches:
    - '**'
  pull_request:
    branches:
    - dev
    - master
    - main
  workflow_dispatch: null

permissions:
  contents: read

# One group per file, workflow, event and ref; only a feature ref cancels its
# superseded runs. The canonical block: actions/check-workflows.
concurrency:
  group: test-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !contains(fromJSON('["refs/heads/dev","refs/heads/master"]'), github.ref) && !startsWith(github.ref, 'refs/tags/') }}

# molab is built against its partners (.github/partners.env) at the commits
# scripts/partners.py resolves, as in lint.yml.
env:
  # uv builds molrs through maturin's PEP 517 hook; this makes that cargo
  # build --locked as well.
  MATURIN_PEP517_ARGS: --locked

jobs:
  # Where this run happens, decided once: MolCrafts/molcrafts-ci/actions/ci-context.
  context:
    permissions:
      contents: read
    name: test
    uses: MolCrafts/molcrafts-ci/.github/workflows/context.yml@f5d3606fab87fc162271c94219dbdc5201dd1aab

  python:
    name: test / python (${{ matrix.os }})
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.context.outputs.tier == 'full' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-python@f5d3606fab87fc162271c94219dbdc5201dd1aab
      - uses: MolCrafts/molcrafts-ci/actions/setup-partners@f5d3606fab87fc162271c94219dbdc5201dd1aab
      # molrs/rust-toolchain.toml pins the compiler that builds the molrs wheel.
      - uses: MolCrafts/molcrafts-ci/actions/setup-rust@f5d3606fab87fc162271c94219dbdc5201dd1aab
        with:
          toolchain-dir: ../molrs
          cache: molrs-python
          workspaces: ../molrs/molrs-python -> ../target
      - run: uv run --extra dev pytest tests/ -q

  web:
    name: test / web
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: MolCrafts/molcrafts-ci/actions/setup-node@f5d3606fab87fc162271c94219dbdc5201dd1aab
      - run: npm run test:web

  docs:
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    uses: ./.github/workflows/docs.yml
    secrets: inherit

  lint:
    needs: context
    if: needs.context.outputs.skip-pr != 'true'
    uses: ./.github/workflows/lint.yml
    secrets: inherit

  result:
    name: test / result
    needs: [context, python, web, docs, lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; . == "success" or . == "skipped")'
