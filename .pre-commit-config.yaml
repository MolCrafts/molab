# Managed by prek: `prek install` (installs both hook types).
# CI parity: every job in .github/workflows/{lint,test}.yml has a hook here
# running the same command.
#
#   pre-commit  file hygiene, ruff (format + lint) in place; ty in CI's
#               sibling layout.
#   pre-push    the commit hooks again on --all-files, the partners check, the
#               unit suite, and the web gates.
#
# ty and the unit suite run in CI's sibling layout
# (`scripts/partners.py run`): a copy of this working tree next to molpy,
# molrs, mollog, molcfg and molq at the commits scripts/partners.py resolves
# (molpy's and molrs's dev, or their branches named like this one), never the
# developer's own ../molpy or ../molrs. ty and the suite build molrs;
# scripts/hook-run.sh hands them to $MOLCRAFTS_HOOK_RUNNER (a compute node on
# the MolCrafts cluster) when set and runs them in place otherwise. Never
# --no-verify.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
exclude: '^apps/web/src/api/generated/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: mixed-line-ending
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]

  - repo: local
    hooks:
      # lint.yml `lint / python`. Whole-tree (not per-file): a type error is
      # usually raised by the *caller* of the file you edited.
      - id: ty
        name: "ty check src/ against the resolved partners (lint.yml)"
        entry: >-
          scripts/hook-run.sh python3 scripts/partners.py run --
          env MATURIN_PEP517_ARGS=--locked
          uv run --extra dev ty check src/
        language: system
        pass_filenames: false
        files: '\.py$|^pyproject\.toml$|^\.github/partners\.env$'

      # A commit checks its staged files only. Re-run the commit-time hooks
      # above over the whole tree, so an untouched file cannot carry a defect.
      - id: all-files
        name: commit hooks on --all-files
        entry: prek run --all-files --hook-stage pre-commit --show-diff-on-failure
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # lint.yml: every partner resolves, and every path dependency resolves
      # inside the layout CI checks out.
      - id: partners
        name: partners resolve; path sources resolve in CI
        entry: python3 scripts/partners.py check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # test.yml `test / python`: the same command, in CI's layout.
      - id: pytest
        name: pytest against the resolved partners (test.yml)
        entry: >-
          scripts/hook-run.sh python3 scripts/partners.py run --
          env MATURIN_PEP517_ARGS=--locked
          uv run --extra dev pytest tests/ -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # lint.yml `lint / web` and test.yml `test / web`.
      - id: web-checks
        name: "CI web (biome lint + tsc + rstest)"
        entry: scripts/hook-run.sh bash -c 'npm run lint && npm run typecheck && npm run test:web'
        language: system
        pass_filenames: false
        files: '^apps/(web|vsc-ext)/'
        stages: [pre-push]
