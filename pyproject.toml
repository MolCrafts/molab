[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setup"
backend-path = ["."]

[project]
name = "molcrafts-molab"
# Keep in sync with src/molab/__init__.py::__version__ (one bump, two sites).
version = "0.1.0"
description = "Scientific-workflow platform for FAIR research"
authors = [{name = "molcrafts"}]
license = {text = "BSD-3-Clause"}
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=14.3.4",
    "fastapi>=0.100.0",
    # File() / UploadFile routes (knowledge doc media) import this at startup.
    "python-multipart>=0.0.9",
    "uvicorn>=0.23.0",
    "pathspec>=0.12.0",
    # The workflow engine imports anyio directly (CapacityLimiter / task
    # groups in molab.workflow._engine); do not rely on it arriving via FastAPI.
    "anyio>=4.0",
    "argon2-cffi>=23.1.0",
    "molcrafts-mollog>=1.0.0",
    "molcrafts-molcfg>=1.2.0",
    "molcrafts-molq>=0.2.0",
    # Science plugins (molab.plugins.molpy / molvis / submit_molq) import
    # these products directly. molrs is reached only through molpy.
    "molcrafts-molpy>=0.13.1",
    "zarr>=3",
    # molrec is a protocol, not a library — never a runtime dependency.
    # A conformance suite, if added, is a test-only extra (not imported from src/).
]

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.15"]
all = ["molcrafts-molab[tensorboard]"]
dev = [
    "molcrafts-molab[all]",
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "httpx>=0.24",
    "psutil>=5.9.0",
    # tests/test_workflow/test_codec.py validates the link schema; it used to
    # arrive only transitively, through the removed agent extra.
    "jsonschema>=4.0",
    # Match .pre-commit-config.yaml ruff-pre-commit rev so META.build.check /
    # bare `ruff` on PATH agrees with the commit hooks. Keep these at latest.
    "ruff==0.16.2",
    "ty==0.0.69",
    "tox>=4.23",
    # Build binding only. molrs is molpy's dependency, not molab's API — no
    # molab module may `import molrs` (Frame/Block come from molpy). It is
    # named here solely because `[tool.uv.sources]` path overrides apply to a
    # project's OWN requirements, not to transitive ones: without this line the
    # local editable molpy resolves against the published molrs instead of the
    # matching-minor sibling checkout. Under CI's UV_NO_SOURCES=1 it resolves
    # from the index like any other package.
    "molcrafts-molrs",
]
docs = [
    "zensical>=0.0.45",
    "molcrafts-zensical-theme>=0.2.2",
]

[tool.uv.sources]
molcrafts-mollog = { path = "../mollog", editable = true }
molcrafts-molcfg = { path = "../molcfg", editable = true }
molcrafts-molq = { path = "../molq", editable = true }
molcrafts-molpy = { path = "../molpy", editable = true }
molcrafts-molrs = { path = "../molrs/molrs-python", editable = true }

[project.scripts]
molab = "molab.cli:app"

# Extension points: third-party packages may register molab.cli_plugins / molab.server_plugins / molab.ui_plugins entry points; molab itself ships none.

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "unit: fast standalone tests for a single function/class",
    "integration: tests that exercise multi-component flows (FastAPI, workspace)",
]

[tool.ruff]
line-length = 100
# Matches requires-python: the lint gate must reject syntax the floor
# (3.12) cannot parse — PEP 758 `except A, B:` slipped in exactly this way.
target-version = "py312"
extend-exclude = [
    "src/molab/dist",
    "apps",
    "build",
    "dist",
    "site",
    "node_modules",
    ".venv",
]

[tool.ruff.lint]
# Strict ruleset for the molab Python codebase.
#   E, W, F, I  — pycodestyle / pyflakes / isort baseline
#   B           — flake8-bugbear
#   UP          — pyupgrade (modern py312+ syntax)
#   SIM         — flake8-simplify
#   RUF         — ruff-specific rules
#   ANN         — flake8-annotations (drives ANN401: ban `Any`)
#   ARG         — unused-argument
#   PTH         — flake8-use-pathlib
#   TID         — flake8-tidy-imports
#   PIE         — flake8-pie
#   RET         — flake8-return
#   C4          — flake8-comprehensions
select = [
    "E", "W", "F", "I",
    "B", "UP", "SIM", "RUF",
    "ANN", "ARG", "PTH",
    "PIE", "RET", "C4",
]
ignore = [
    "E501",     # line-length — handled by ruff-format, not the linter
    "B008",     # function call in default arg — FastAPI Depends / typer options rely on this
    "SIM108",   # ternary noise — judgement call, often less readable
    "RET504",   # unnecessary assignment before return — local naming aids debugging
]

[tool.ruff.lint.per-file-ignores]
# Tests can use `Any` in fixtures/conftest where it's genuinely opaque,
# and may freely declare untyped fixture functions.
"tests/**" = ["ANN001", "ANN201", "ANN202", "ANN204", "ANN401", "ARG001", "ARG002"]
# Examples are user-facing tutorials — annotation gaps are pedagogically OK.
"examples/**" = ["ANN001", "ANN201", "ANN202", "ANN204", "ANN401", "ARG001", "ARG002"]
# `__init__.py` re-export modules don't need annotations on `__all__` etc.
"**/__init__.py" = ["F401"]
# CLI entry-points use typer-style decorators with implicit return types.
"src/molab/cli/**" = ["ANN201", "ANN202"]

[tool.ruff.lint.flake8-annotations]
# ANN401 (`Any` is not allowed) is in the default `ANN` selection.
# These options sharpen its enforcement.
allow-star-arg-any = false
suppress-dummy-args = true

[tool.ruff.format]
line-ending = "lf"
docstring-code-format = true

# ─── ty (type checker) ───────────────────────────────────────────────────────
[tool.ty.environment]
# Pin resolution to the project venv: a monorepo shell often exports
# VIRTUAL_ENV=<root>/.venv, and without this pin ty resolves third-party
# imports against the wrong environment (third-party packages show up as
# unresolved-import even though `uv run` imports them fine).
python = "./.venv"

[tool.ty.src]
include = ["src", "tests", "examples"]
exclude = [
    "src/molab/dist",
    "apps",
    "build",
    "dist",
    "site",
    "node_modules",
    ".venv",
    "**/__pycache__",
]

[tool.ty.rules]
# ty is still alpha; we keep the default rule set and treat all diagnostics
# as errors. Concrete `Any` enforcement happens through ruff ANN401.
unresolved-import = "error"
invalid-assignment = "error"
invalid-type-form = "error"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
molab = [
    "openapi.json",
    "dist/**",
]

# Isolated gates — prek + CI: uv run --extra dev tox -e lint|py
[tool.tox]
requires = ["tox>=4.23"]
env_list = ["lint", "py"]

[tool.tox.env.lint]
description = "CI lint"
skip_install = true
base_python = ["python3.12"]
deps = [
  "ruff==0.16.2",
  "ty==0.0.69",
]
commands = [
  ["ruff", "check", "."],
]

[tool.tox.env.py]
description = "CI test (non-editable package when package=wheel)"
base_python = ["python3.12"]
pass_env = [
  "HOME",
  "PATH",
  "SSH_AUTH_SOCK",
  "TERM",
  "VIRTUAL_ENV",
  "UV_*",
]
package = "wheel"
extras = ["dev"]
commands_pre = [
  [
    "{envpython}",
    "-c",
    "import pathlib, site; sps=site.getsitepackages(); print('site-packages', sps)",
  ],
]
commands = [
  ["{envpython}", "-m", "pytest", "tests/", "-q", "--cov=src/molab", "--cov-report=xml"],
]
